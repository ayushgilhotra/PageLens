spring.application.name=PageLens API
server.port=${PORT:8080}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.pagelens=${LOGGING_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Ensure UTF-8 everywhere
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Connect/Read timeouts for Jsoup web analysis
pagelens.analysis.timeout-ms=${ANALYSIS_TIMEOUT_MS:10000}
